name: Windows release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Check architecture boundaries
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Restore
        run: dotnet restore NorthstarBrowser.csproj
      - name: Audit dependencies
        run: dotnet list NorthstarBrowser.csproj package --vulnerable --include-transitive
      - name: Publish
        run: dotnet publish NorthstarBrowser.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Northstar.iss'
      - name: SHA-256
        shell: pwsh
        run: Get-FileHash artifacts\*.exe -Algorithm SHA256 | Format-List | Out-File artifacts\SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Newton-Windows
          path: artifacts/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
